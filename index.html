<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistencia Petra Ríos</title>
<meta name="theme-color" content="#1B2559">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asistencia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
</head>
<body>
<header>
  <div class="cab">
    <div class="logo-tile"><img src="logo.png" alt="Escudo de la Secundaria Petra Ríos"></div>
    <div class="textos">
      <span class="sobre" id="sobre">Escuela Secundaria Oficial "Petra Ríos"</span>
      <h1 id="titulo">Asistencia escolar</h1>
    </div>
    <button id="salir" class="avatar hidden" aria-label="Mi cuenta" onclick="menuCuenta()"></button>
  </div>
  <div id="cabExtra"></div>
</header>
<div id="banner" class="banner hidden"></div>
<main id="main"><div class="cargando">Cargando…</div></main>
<nav id="nav"></nav>

<div id="login" class="hidden">
  <div class="franja-l"></div>
  <div class="arriba">
    <div class="escudo"><img src="logo.png" alt="Escudo de la Secundaria Petra Ríos"></div>
    <h1>Asistencia escolar</h1>
    <p class="sub" id="loginEscuela">Escuela Secundaria Oficial "Petra Ríos"<br>Romita, Gto.</p>
    <div class="rayas"><span></span><span></span><span></span></div>
  </div>
  <div class="hoja">
    <h2>Bienvenido</h2>
    <div class="tenue" style="font-size:14px">Entra con la cuenta de Google de tu correo @seg-gto.gob.mx.</div>
    <div id="gbtn"></div>
    <div id="loginMsg" class="mal" style="font-size:14px;text-align:center;margin-bottom:10px"></div>
    <div class="candado">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2559" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Solo entra el personal dado de alta por la dirección.
    </div>
  </div>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)cerrar()"><div class="caja" id="modalBody"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="print"></div>
<script src="app.js"></script>
</body>
</html>
